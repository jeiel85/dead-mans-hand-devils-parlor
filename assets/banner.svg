<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Dead Man's Hand: Devil's Parlor">
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="75%">
      <stop offset="0" stop-color="#2a1414"/>
      <stop offset="0.6" stop-color="#0d0808"/>
      <stop offset="1" stop-color="#050303"/>
    </radialGradient>
    <linearGradient id="felt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d3a2a"/>
      <stop offset="1" stop-color="#0f2419"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3dca0"/>
      <stop offset="0.5" stop-color="#e5c07b"/>
      <stop offset="1" stop-color="#9c7f4a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <!-- table edge -->
  <path d="M0 230 Q600 170 1200 230 L1200 300 L0 300 Z" fill="url(#felt)"/>
  <path d="M0 230 Q600 170 1200 230" fill="none" stroke="#6b4a30" stroke-width="10"/>
  <path d="M0 236 Q600 176 1200 236" fill="none" stroke="#3a2418" stroke-width="4"/>

  <!-- cards -->
  <g filter="url(#shadow)" transform="translate(120 130) rotate(-14)">
    <rect x="0" y="0" width="92" height="130" rx="9" fill="#efe3c8"/>
    <text x="10" y="26" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#7a1a2c">Q</text>
    <text x="46" y="86" text-anchor="middle" font-family="Georgia, serif" font-size="56" fill="#7a1a2c">♛</text>
    <text x="82" y="122" text-anchor="end" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#7a1a2c" transform="rotate(180 82 116)">Q</text>
  </g>
  <g filter="url(#shadow)" transform="translate(190 118) rotate(-4)">
    <rect x="0" y="0" width="92" height="130" rx="9" fill="#efe3c8"/>
    <text x="10" y="26" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#1f2f6b">K</text>
    <text x="46" y="86" text-anchor="middle" font-family="Georgia, serif" font-size="56" fill="#1f2f6b">♚</text>
  </g>
  <g filter="url(#shadow)" transform="translate(262 120) rotate(8)">
    <rect x="0" y="0" width="92" height="130" rx="9" fill="#5e1717"/>
    <rect x="8" y="8" width="76" height="114" rx="5" fill="none" stroke="#efe3c8" stroke-opacity="0.7" stroke-width="2"/>
    <path d="M8 8 L84 122 M84 8 L8 122" stroke="#efe3c8" stroke-opacity="0.25" stroke-width="2"/>
  </g>

  <!-- cylinder -->
  <g transform="translate(1000 150)" filter="url(#shadow)">
    <circle r="92" fill="#231d1a" stroke="#6b5a48" stroke-width="5"/>
    <circle r="13" fill="#0f0c0b" stroke="#6b5a48" stroke-width="3"/>
    <g>
      <circle cx="0" cy="-58" r="19" fill="#7a1f1f" stroke="#e5c07b" stroke-width="3" filter="url(#glow)"/>
      <text x="0" y="-52" text-anchor="middle" font-size="18" fill="#f5d5d5">●</text>
      <circle cx="50" cy="-29" r="19" fill="#1b1614" stroke="#5a4a3a" stroke-width="2"/>
      <circle cx="50" cy="29" r="19" fill="#1b1614" stroke="#5a4a3a" stroke-width="2"/>
      <circle cx="0" cy="58" r="19" fill="#3a3632" stroke="#5a4a3a" stroke-width="2"/>
      <text x="0" y="64" text-anchor="middle" font-size="18" fill="#bbb">○</text>
      <circle cx="-50" cy="29" r="19" fill="#4a2a6a" stroke="#5a4a3a" stroke-width="2"/>
      <text x="-50" y="35" text-anchor="middle" font-size="18" fill="#e0c8ff">✦</text>
      <circle cx="-50" cy="-29" r="19" fill="#1b1614" stroke="#5a4a3a" stroke-width="2"/>
    </g>
    <path d="M0 -104 l-9 16 h18 z" fill="#e5c07b"/>
  </g>

  <!-- title -->
  <text x="600" y="118" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="64" font-weight="700" letter-spacing="8" fill="url(#brass)" filter="url(#glow)">DEAD MAN'S HAND</text>
  <text x="600" y="160" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="26" letter-spacing="10" fill="#c8b89a">DEVIL'S PARLOR</text>
  <text x="600" y="200" text-anchor="middle" font-family="system-ui, 'Segoe UI', 'Noto Sans KR', sans-serif" font-size="17" fill="#8f8577">망자의 패: 악마의 살롱 · 블러핑 × 러시안 룰렛 × 로그라이크 · GDD + 브라우저 프로토타입</text>
  <g font-family="system-ui, 'Segoe UI', sans-serif" font-size="13" fill="#e5c07b" text-anchor="middle">
    <rect x="465" y="216" width="270" height="26" rx="13" fill="#1a100d" stroke="#9c7f4a"/>
    <text x="600" y="234">▶ jeiel85.github.io/dead-mans-hand-devils-parlor</text>
  </g>
</svg>
