name: Release builds

# Tag-driven: pushing vX.Y.Z exports Windows, Linux and Web from the same
# Godot project and attaches the three zips to the GitHub release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and attach to
        required: true

permissions:
  contents: write

env:
  GODOT_VERSION: 4.7.2

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Cache Godot editor and export templates
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}

      - name: Install Godot ${{ env.GODOT_VERSION }} and export templates
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          if [ ! -x "$HOME/godot/godot" ]; then
            mkdir -p "$HOME/godot"
            curl -fsSL -o /tmp/godot.zip "$BASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
            unzip -q /tmp/godot.zip -d /tmp/godot
            mv "/tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" "$HOME/godot/godot"
            chmod +x "$HOME/godot/godot"
          fi
          TPL="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          if [ ! -f "$TPL/windows_release_x86_64.exe" ]; then
            curl -fsSL -o /tmp/templates.tpz "$BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
            unzip -q /tmp/templates.tpz -d /tmp/templates
            mkdir -p "$TPL"
            mv /tmp/templates/templates/* "$TPL/"
          fi

      - name: Check the tag matches the project version
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          PROJECT_VERSION=$(sed -n 's/^config\/version="\(.*\)"$/\1/p' godot/project.godot)
          echo "tag=$TAG project=$PROJECT_VERSION"
          if [ "$TAG" != "v$PROJECT_VERSION" ]; then
            echo "::error::tag $TAG does not match godot/project.godot version $PROJECT_VERSION"
            exit 1
          fi

      - name: Install the export wrapper
        run: bash .github/scripts/install-godot-export.sh

      - name: Export all presets
        run: |
          set -euo pipefail
          mkdir -p build/web build/windows build/linux
          timeout 600 "$HOME/godot/godot" --headless --path godot --import || true
          "$RUNNER_TEMP/godot-export.sh" "Web" ../build/web/index.html
          "$RUNNER_TEMP/godot-export.sh" "Windows Desktop" ../build/windows/DeadMansHand.exe
          "$RUNNER_TEMP/godot-export.sh" "Linux" ../build/linux/DeadMansHand.x86_64
          test -s build/web/index.wasm
          test -s build/windows/DeadMansHand.exe
          test -s build/linux/DeadMansHand.x86_64
          chmod +x build/linux/DeadMansHand.x86_64

      - name: Upload export logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-export-logs-release
          path: ${{ runner.temp }}/exportlogs
          if-no-files-found: ignore

      - name: Package
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          mkdir -p dist
          (cd build/windows && zip -qr "../../dist/DeadMansHand-${TAG}-windows.zip" .)
          (cd build/linux && zip -qr "../../dist/DeadMansHand-${TAG}-linux.zip" .)
          (cd build/web && zip -qr "../../dist/DeadMansHand-${TAG}-web.zip" .)
          ls -la dist

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi
          gh release upload "$TAG" dist/* --clobber
