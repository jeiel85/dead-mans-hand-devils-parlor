name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Unit tests (engine + AI)
        run: npm test
      - name: Balance simulation smoke run
        run: node tools/simulate.js 300 both

  godot:
    name: Godot engine tests
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: 4.7.2
    steps:
      - uses: actions/checkout@v4
      - name: Cache Godot editor
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-editor-4.7.2
      - name: Install Godot
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/godot/godot" ]; then
            mkdir -p "$HOME/godot"
            curl -fsSL -o /tmp/godot.zip \
              "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
            unzip -q /tmp/godot.zip -d /tmp/godot
            mv "/tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" "$HOME/godot/godot"
            chmod +x "$HOME/godot/godot"
          fi
      - name: Rules, AI, fuzz and cross-engine trace tests
        run: |
          set -euo pipefail
          # Import once so class_name globals resolve; it may hang on shutdown.
          timeout 600 "$HOME/godot/godot" --headless --path godot --import || true
          "$HOME/godot/godot" --headless --path godot res://test/test_runner.tscn | tee /tmp/godot-test.log
          grep -qE "^[0-9]+ checks, 0 failures$" /tmp/godot-test.log
